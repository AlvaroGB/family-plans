<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>

<title>Planes familia</title>
<style>
  :root {
    --bg: #eef3f1;
    --card: #fff;
    --ink: #12201e;
    --muted: #5b6b68;
    --teal: #0f766e;
    --teal-soft: #ccfbf1;
    --amber: #b45309;
    --amber-soft: #ffedd5;
    --line: #d7e2de;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(18,32,30,.05), 0 10px 28px rgba(18,32,30,.07);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --max: 560px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 500px at 10% -10%, #d9f3ec 0%, transparent 55%),
      radial-gradient(900px 400px at 100% 0%, #ffe8cc 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 12px 14px calc(28px + var(--safe-b)); }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(238,243,241,.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    margin: -12px -14px 14px; padding: 14px 14px 10px;
    border-bottom: 1px solid var(--line);
  }
  .header-inner { max-width: var(--max); margin: 0 auto; }
  .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 2px; letter-spacing: -.02em; }
  .sub { font-size: .82rem; color: var(--muted); margin: 0; }
  .icon-btn {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    min-height: 40px; padding: 8px 12px; font-size: .82rem; font-weight: 700;
    color: var(--teal); cursor: pointer; white-space: nowrap;
  }
  .chips {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 12px 0 4px; margin: 0 -2px; scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: .85rem;
    font-weight: 600; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }
  .panel {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px; margin-bottom: 16px; border: 1px solid var(--line);
  }
  .panel h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .range-row, .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid.full { grid-template-columns: 1fr; }
  label { display: block; font-size: .72rem; color: var(--muted); margin-bottom: 4px; }
  input[type="date"], input[type="text"], input[type="number"], select {
    width: 100%; font-size: 1rem; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: #fafcfb; color: var(--ink);
  }
  .kid-row {
    display: grid; grid-template-columns: 1.2fr .8fr auto; gap: 8px; align-items: end;
    margin-bottom: 8px;
  }
  .kid-row .rm {
    border: 1px solid #fecaca; background: #fff; color: #b91c1c;
    border-radius: 10px; min-height: 42px; padding: 8px 10px; font-weight: 700; cursor: pointer;
  }
  .form-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .section-label {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 22px 0 12px; font-weight: 700;
  }
  .section-label:first-of-type { margin-top: 8px; }
  #pinned-wrap { margin-top: 8px; margin-bottom: 8px; }
  #list { margin-top: 0; }
  #custom-inline {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: end;
    padding: 4px 0 2px;
  }
  #custom-inline .di {
    display: flex; flex-direction: column; gap: 4px; min-width: 9.5rem;
  }
  #custom-inline label { margin: 0; }
  #custom-inline input[type="date"] {
    min-height: 38px; padding: 6px 10px; font-size: .9rem;
  }
  #list, #pinned { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 8px; }
  .card {
    position: relative; background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--accent, #94a3b8); }
  .card.type-ticket { --accent: #ea580c; background: linear-gradient(145deg, #fff7ed 0%, #fff 42%); border-color: #fed7aa; }
  .card.type-booked { --accent: #0f766e; background: linear-gradient(145deg, #ecfdf5 0%, #fff 42%); border-color: #99f6e4; }
  .card.type-festejo { --accent: #c026d3; background: linear-gradient(145deg, #fdf4ff 0%, #fff 45%); border-color: #f5d0fe; }
  .card.type-beach { --accent: #0284c7; background: linear-gradient(145deg, #e0f2fe 0%, #fff 45%); border-color: #bae6fd; }
  .card.type-watch { --accent: #64748b; background: linear-gradient(145deg, #f1f5f9 0%, #fff 45%); border-color: #e2e8f0; }
  .card.type-aldea { --accent: #65a30d; background: linear-gradient(145deg, #f7fee7 0%, #fff 45%); border-color: #d9f99d; }
  .card.type-soon { --accent: #0891b2; background: linear-gradient(145deg, #ecfeff 0%, #fff 45%); border-color: #a5f3fc; }
  .card.pinned-card { box-shadow: 0 0 0 2px rgba(15,118,110,.18), var(--shadow); }
  .badge {
    display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; margin: 0 6px 6px 0;
  }
  .badge.urgent { background: var(--amber-soft); color: var(--amber); }
  .badge.booked { background: var(--teal-soft); color: var(--teal); }
  .badge.soon { background: #e0f2fe; color: #0369a1; }
  .badge.aldea { background: #ecfccb; color: #3f6212; }
  .badge.watch { background: #f1f5f9; color: #475569; }
  .badge.festejo { background: #fae8ff; color: #a21caf; }
  .badge.ticket { background: #ffedd5; color: #c2410c; }
  .badge.beach { background: #e0f2fe; color: #0369a1; }
  .badge.pinned { background: #ccfbf1; color: #0f766e; }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .pin-btn {
    flex: 0 0 auto; border: 1px solid var(--line); background: rgba(255,255,255,.75);
    border-radius: 999px; min-height: 36px; padding: 6px 10px; font-size: .78rem;
    font-weight: 700; color: var(--muted); cursor: pointer;
  }
  .pin-btn[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }
  .when { font-size: .82rem; color: var(--muted); margin: 0 0 4px; }
  .title { font-size: 1.05rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
  .why { font-size: .92rem; margin: 0 0 10px; }
  .meta { font-size: .8rem; color: var(--muted); margin: 0 0 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 42px; padding: 10px 14px; border-radius: 11px; font-size: .9rem;
    font-weight: 650; text-decoration: none; border: none; cursor: pointer; flex: 1 1 auto;
  }
  .btn.primary { background: var(--teal); color: #fff; }
  .btn.ghost { background: #fff; color: var(--teal); border: 1px solid #99f6e4; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: .95rem; }
  footer { font-size: .72rem; color: var(--muted); text-align: center; margin-top: 22px; padding: 0 8px; }
  #filter-empty { display: none; }
  #pinned-wrap[hidden], #settings[hidden] { display: none !important; }
  .hint { font-size: .8rem; color: var(--muted); margin: 0 0 10px; }

  @media (min-width: 720px) {
    :root { --max: 920px; }
    .wrap { padding: 20px 24px 40px; }
    header { margin: -20px -24px 18px; padding: 18px 24px 12px; }
    h1 { font-size: 1.45rem; }
    .chips { flex-wrap: wrap; overflow: visible; }
    #list, #pinned { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .btn { flex: 0 1 auto; min-width: 140px; }
    .form-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1100px) {
    :root { --max: 1180px; }
    .wrap { padding: 28px 32px 48px; }
    header { margin: -28px -32px 22px; padding: 22px 32px 14px; }
    #list, #pinned { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { min-height: 100%; display: flex; flex-direction: column; }
    .actions { margin-top: auto; }
  }
</style>

<script>
const _now = new Date();
const TODAY = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate());
const PIN_KEY = "family-plans-pinned-v1";
const PROFILE_KEY = "family-plans-profile-v1";

const DEFAULT_PROFILE = {
  title: "Planes familia",
  base: "",
  adults: "",
  radiusMin: 60,
  kids: [
    { name: "", birthYear: null },
    { name: "", birthYear: null }
  ]
};

function ageFromYear(y) {
  if (!y) return null;
  const a = TODAY.getFullYear() - Number(y);
  return a >= 0 && a < 30 ? a : null;
}
function loadProfile() {
  try {
    const raw = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
    if (!raw) return structuredClone(DEFAULT_PROFILE);
    return {
      title: raw.title || DEFAULT_PROFILE.title,
      base: raw.base || "",
      adults: raw.adults || "",
      radiusMin: Number(raw.radiusMin) || 60,
      kids: Array.isArray(raw.kids) && raw.kids.length ? raw.kids.map(k => ({
        name: k.name || "",
        birthYear: k.birthYear ? Number(k.birthYear) : null
      })) : structuredClone(DEFAULT_PROFILE.kids)
    };
  } catch {
    return structuredClone(DEFAULT_PROFILE);
  }
}
function saveProfile(p) {
  localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
}
let profile = loadProfile();

function kidLabel(i) {
  const k = profile.kids[i];
  if (!k) return `niño ${i+1}`;
  const age = ageFromYear(k.birthYear);
  if (k.name && age != null) return `${k.name} (${age})`;
  if (k.name) return k.name;
  if (age != null) return `niño de ${age}`;
  return `niño ${i+1}`;
}
function kidsSummary() {
  const parts = profile.kids
    .map((k, i) => {
      const age = ageFromYear(k.birthYear);
      if (k.name && age != null) return `${k.name} (${age})`;
      if (k.name) return k.name;
      if (age != null) return `${age} años`;
      return null;
    })
    .filter(Boolean);
  return parts.length ? parts.join(" · ") : "Añade niños en Perfil";
}
function fillHeader() {
  document.getElementById("app-title").textContent = profile.title || "Planes familia";
  const base = profile.base ? profile.base : "Sin zona";
  document.getElementById("app-sub").textContent = `${base} · ${kidsSummary()}`;
  document.title = profile.title || "Planes familia";
}

function tpl(s) {
  if (!s) return "";
  return s
    .replaceAll("{{base}}", profile.base || "vuestra zona")
    .replaceAll("{{kid0}}", kidLabel(0))
    .replaceAll("{{kid1}}", kidLabel(1))
    .replaceAll("{{kid2}}", kidLabel(2));
}

function parseYMD(s) {
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function addDays(d, n) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate()+n);
  return x;
}
function upcomingWeekend(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (x.getDay()+6)%7;
  let sat = day <= 5 ? addDays(x, 5-day) : (day === 6 ? x : addDays(x, -1));
  if (day === 6) sat = x;
  return [sat, addDays(sat, 1)];
}
function overlaps(ev, from, to) {
  return parseYMD(ev.start) <= to && parseYMD(ev.end) >= from;
}
function formatDay(s) {
  return parseYMD(s).toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
}
function loadPins() {
  try { return new Set(JSON.parse(localStorage.getItem(PIN_KEY) || "[]")); }
  catch { return new Set(); }
}
function savePins(set) { localStorage.setItem(PIN_KEY, JSON.stringify([...set])); }
let pins = loadPins();

function typeBadge(type) {
  const map = {
    ticket: ["ticket", "Entradas"], booked: ["booked", "Reservado"], festejo: ["festejo", "Festejo"],
    beach: ["beach", "Playa"], watch: ["watch", "Vigilando"], aldea: ["aldea", "Aldea"], soon: ["soon", "Próximo"]
  };
  return map[type] || ["soon", "Próximo"];
}
function cardHTML(ev) {
  const pinned = pins.has(ev.id);
  const [bClass, bLabel] = typeBadge(ev.type);
  const urgent = ev.tags.includes("urgent") ? `<span class="badge urgent">Urgente</span>` : "";
  const pinBadge = pinned ? `<span class="badge pinned">Fijado</span>` : "";
  const when = ev.start === ev.end
    ? formatDay(ev.start) + (ev.times ? " · " + ev.times : "")
    : formatDay(ev.start) + " – " + formatDay(ev.end) + (ev.times ? " · " + ev.times : "");
  return `<article class="card type-${ev.type}${pinned ? " pinned-card" : ""}" data-id="${ev.id}">
    <div class="top-row">
      <div class="badges">
        <span class="badge ${bClass}">${bLabel}</span>${urgent}${pinBadge}
      </div>
      <button type="button" class="pin-btn" data-pin="${ev.id}" aria-pressed="${pinned ? "true" : "false"}">${pinned ? "Fijado" : "Fijar"}</button>
    </div>
    <p class="when">${when}</p>
    <h3 class="title">${tpl(ev.title)}</h3>
    <p class="why">${tpl(ev.why)}</p>
    <p class="meta">${tpl(ev.place || "")}</p>
    <div class="actions">
      ${ev.link ? `<a class="btn primary" href="${ev.link}" target="_blank" rel="noopener">${ev.linkLabel || "Abrir"}</a>` : ""}
    </div>
  </article>`;
}

let mode = "upcoming";
const list = document.getElementById("list");
const pinnedEl = document.getElementById("pinned");
const pinnedWrap = document.getElementById("pinned-wrap");
const empty = document.getElementById("filter-empty");
const settings = document.getElementById("settings");
const fromEl = document.getElementById("from");
const toEl = document.getElementById("to");
const listLabel = document.getElementById("list-label");
const kidsEditor = document.getElementById("kids-editor");

function setChip(preset) {
  document.querySelectorAll(".chip").forEach(c => {
    c.setAttribute("aria-pressed", c.dataset.preset === preset ? "true" : "false");
  });
}
function filtered() {
  if (mode === "upcoming") {
    const horizon = addDays(TODAY, 21);
    return EVENTS.filter(ev => overlaps(ev, TODAY, horizon))
      .filter(ev => ev.priority >= 45 || ev.tags.includes("booked") || ev.tags.includes("urgent") || ev.tags.includes("ticket"))
      .sort((a,b) => b.priority - a.priority || a.start.localeCompare(b.start));
  }
  if (mode === "weekend") {
    const [sat, sun] = upcomingWeekend(TODAY);
    return EVENTS.filter(ev => overlaps(ev, sat, sun)).sort((a,b) => b.priority - a.priority || a.start.localeCompare(b.start));
  }
  if (mode === "week") {
    return EVENTS.filter(ev => overlaps(ev, TODAY, addDays(TODAY, 6))).sort((a,b) => a.start.localeCompare(b.start) || b.priority - a.priority);
  }
  if (mode === "month") {
    const start = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    const end = new Date(TODAY.getFullYear(), TODAY.getMonth()+1, 0);
    return EVENTS.filter(ev => overlaps(ev, start, end)).sort((a,b) => a.start.localeCompare(b.start) || b.priority - a.priority);
  }
  const f = fromEl.value ? parseYMD(fromEl.value) : TODAY;
  const t = toEl.value ? parseYMD(toEl.value) : addDays(TODAY, 30);
  return EVENTS.filter(ev => overlaps(ev, f, t)).sort((a,b) => a.start.localeCompare(b.start) || b.priority - a.priority);
}
function bindPins(root) {
  root.querySelectorAll("[data-pin]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-pin");
      if (pins.has(id)) pins.delete(id); else pins.add(id);
      savePins(pins);
      render();
    });
  });
}
function renderKidsEditor() {
  kidsEditor.innerHTML = profile.kids.map((k, i) => `
    <div class="kid-row" data-kid-i="${i}">
      <div>
        <label>Nombre</label>
        <input type="text" data-k="name" value="${(k.name||"").replaceAll('"','&quot;')}" placeholder="Nombre"/>
      </div>
      <div>
        <label>Año nac.</label>
        <input type="number" data-k="birthYear" min="2005" max="${TODAY.getFullYear()}" value="${k.birthYear || ""}" placeholder="2022"/>
      </div>
      <button type="button" class="rm" data-rm="${i}" ${profile.kids.length<=1?"disabled":""}>Quitar</button>
    </div>`).join("");
  kidsEditor.querySelectorAll("[data-rm]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.getAttribute("data-rm"));
      if (profile.kids.length <= 1) return;
      profile.kids.splice(i, 1);
      renderKidsEditor();
    });
  });
}
function readProfileForm() {
  profile.title = document.getElementById("pf-title").value.trim() || "Planes familia";
  profile.base = document.getElementById("pf-base").value.trim();
  profile.adults = document.getElementById("pf-adults").value.trim();
  profile.radiusMin = Number(document.getElementById("pf-radius").value) || 60;
  profile.kids = [...kidsEditor.querySelectorAll(".kid-row")].map(row => ({
    name: row.querySelector('[data-k="name"]').value.trim(),
    birthYear: row.querySelector('[data-k="birthYear"]').value ? Number(row.querySelector('[data-k="birthYear"]').value) : null
  }));
  if (!profile.kids.length) profile.kids = [{ name: "", birthYear: null }];
}
function fillProfileForm() {
  document.getElementById("pf-title").value = profile.title || "";
  document.getElementById("pf-base").value = profile.base || "";
  document.getElementById("pf-adults").value = profile.adults || "";
  document.getElementById("pf-radius").value = profile.radiusMin || 60;
  renderKidsEditor();
}
function render() {
  fillHeader();
  const items = filtered();
  const pinnedItems = EVENTS.filter(ev => pins.has(ev.id))
    .sort((a,b) => b.priority - a.priority || a.start.localeCompare(b.start));
  pinnedWrap.hidden = pinnedItems.length === 0;
  pinnedEl.innerHTML = pinnedItems.map(cardHTML).join("");
  const rest = items.filter(ev => !pins.has(ev.id));
  list.innerHTML = rest.map(cardHTML).join("");
  empty.style.display = (rest.length || pinnedItems.length) ? "none" : "block";
  listLabel.style.display = rest.length ? "block" : "none";
  listLabel.textContent = mode === "upcoming" ? "Próximos importantes" : "En este tramo";
  bindPins(document);
}

document.getElementById("settings-toggle").addEventListener("click", () => {
  const open = settings.hasAttribute("hidden");
  settings.hidden = !open;
  if (open) fillProfileForm();
});
document.getElementById("add-kid").addEventListener("click", () => {
  readProfileForm();
  profile.kids.push({ name: "", birthYear: null });
  renderKidsEditor();
});
document.getElementById("save-profile").addEventListener("click", () => {
  readProfileForm();
  saveProfile(profile);
  settings.hidden = true;
  render();
});

document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => {
    mode = chip.dataset.preset;
    setChip(mode);
    render();
  });
});
function useCustomRange() {
  mode = "custom";
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  if (!fromEl.value) fromEl.value = ymd(TODAY);
  if (!toEl.value) toEl.value = ymd(addDays(TODAY, 14));
  render();
}
fromEl.addEventListener("change", useCustomRange);
toEl.addEventListener("change", useCustomRange);

// First visit: open profile if empty
const needsSetup = !localStorage.getItem(PROFILE_KEY) || (!profile.base && !profile.kids.some(k => k.name || k.birthYear));
if (needsSetup) {
  settings.hidden = false;
  fillProfileForm();
}

fromEl.value = ymd(TODAY);
toEl.value = ymd(addDays(TODAY, 14));
document.getElementById("updated").textContent =
  "Perfil y fijados se guardan en este navegador · " + new Date().toLocaleDateString("es-ES");
render();
</script>
</body>
</html>
