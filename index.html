<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f766e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Planes familia</title>
<style>
  :root {
    --bg: #eef3f1;
    --card: #fff;
    --ink: #12201e;
    --muted: #5b6b68;
    --teal: #0f766e;
    --teal-soft: #ccfbf1;
    --amber: #b45309;
    --amber-soft: #ffedd5;
    --line: #d7e2de;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(18,32,30,.05), 0 10px 28px rgba(18,32,30,.07);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --max: 560px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 500px at 10% -10%, #d9f3ec 0%, transparent 55%),
      radial-gradient(900px 400px at 100% 0%, #ffe8cc 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 12px 14px calc(28px + var(--safe-b)); }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(238,243,241,.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    margin: -12px -14px 12px; padding: calc(10px + var(--safe-t)) 12px 6px;
    border-bottom: 1px solid var(--line);
  }
  .header-inner { max-width: var(--max); margin: 0 auto; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  h1 { font-size: 1.2rem; margin: 0 0 2px; letter-spacing: -.02em; }
  .sub { font-size: .82rem; color: var(--muted); margin: 0; }
  .icon-btn {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    min-height: 40px; padding: 8px 12px; font-size: .82rem; font-weight: 700;
    color: var(--teal); cursor: pointer; white-space: nowrap;
  }
  .chips {
    display: flex; gap: 10px 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    padding: 8px 0 2px; margin: 0 -2px; scrollbar-width: none;
    /* Prevent flex items from stretching tall when any child wraps */
    align-items: center;
  }
  .chips::-webkit-scrollbar { display: none; }
  /* Flatten month wrapper so each month chip is a first-class flex item */
  #month-chips { display: contents; }
  /* Fallback for browsers without display: contents */
  @supports not (display: contents) {
    #month-chips { display: inline-flex; flex-direction: row; align-items: center; gap: 8px; }
  }
  .chip {
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 999px; padding: 7px 12px; font-size: .85rem;
    min-height: 38px; font-weight: 600; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }
  .panel {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px; margin-bottom: 16px; border: 1px solid var(--line);
  }
  .panel h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  .range-row, .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-grid.full { grid-template-columns: 1fr; }
  label { display: block; font-size: .72rem; color: var(--muted); margin-bottom: 4px; }
  input[type="date"], input[type="text"], input[type="number"], select {
    width: 100%; font-size: 1rem; padding: 10px; border-radius: 10px;
    border: 1px solid var(--line); background: #fafcfb; color: var(--ink);
  }
  .kid-row {
    display: grid; grid-template-columns: 1.2fr .8fr auto; gap: 8px; align-items: end;
    margin-bottom: 8px;
  }
  .kid-row .rm {
    border: 1px solid #fecaca; background: #fff; color: #b91c1c;
    border-radius: 10px; min-height: 42px; padding: 8px 10px; font-weight: 700; cursor: pointer;
  }
  .form-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .section-label {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 22px 0 12px; font-weight: 700;
  }
  .section-label:first-of-type { margin-top: 8px; }
  #pinned-wrap { margin-top: 8px; margin-bottom: 8px; }
  #list { margin-top: 0; }
  #custom-inline {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: end;
    padding: 4px 0 2px;
  }
  /* Mobile: collapse free-range dates by default to keep header compact */
  @media (max-width: 719px) {
    #custom-inline { display: none; }
    #custom-inline.open { display: flex; }
    /* Hide chips row so the first hit after sticky header is content */
    .chips { display: none; }
  }
  #custom-inline .di {
    display: flex; flex-direction: column; gap: 4px; min-width: 9.5rem;
  }
  #custom-inline label { margin: 0; }
  #custom-inline input[type="date"] {
    min-height: 38px; padding: 6px 10px; font-size: .9rem;
  }
  /* Evergreen mini controls */
  .eg-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .eg-date { min-height: 32px; padding: 6px 8px; font-size: .9rem; }
  .eg-row .btn { flex: 0 0 auto; }
  /* Heatmap strip */
  .heatmap {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 9px;
    grid-template-rows: repeat(7, 8px);
    gap: 2px;
    padding: 6px 6px 6px;
    margin: 6px 0 2px;
    border-radius: 10px;
    background: rgba(255,255,255,.6);
    border: 1px solid var(--line);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .hm-cell {
    width: 8px; height: 8px;
    border-radius: 2px;
    background: #e8eeec;
    cursor: pointer;
  }
  /* Estados: amarillo = inventario; verde = fijado */
  .hm-cell.has { background: #fde68a; }
  .hm-cell.pin { background: #10b981; }
  .heatmap-label { font-size: .74rem; color: var(--muted); margin: 0 0 6px 4px; }
  #list, #pinned { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 8px; }
  .card {
    position: relative; background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px; overflow: hidden;
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--accent, #94a3b8); }
  .card.type-ticket { --accent: #ea580c; background: linear-gradient(145deg, #fff7ed 0%, #fff 42%); border-color: #fed7aa; }
  .card.type-booked { --accent: #0f766e; background: linear-gradient(145deg, #ecfdf5 0%, #fff 42%); border-color: #99f6e4; }
  .card.type-festejo { --accent: #c026d3; background: linear-gradient(145deg, #fdf4ff 0%, #fff 45%); border-color: #f5d0fe; }
  .card.type-beach { --accent: #0284c7; background: linear-gradient(145deg, #e0f2fe 0%, #fff 45%); border-color: #bae6fd; }
  .card.type-watch { --accent: #64748b; background: linear-gradient(145deg, #f1f5f9 0%, #fff 45%); border-color: #e2e8f0; }
  .card.type-aldea { --accent: #65a30d; background: linear-gradient(145deg, #f7fee7 0%, #fff 45%); border-color: #d9f99d; }
  .card.type-soon { --accent: #0891b2; background: linear-gradient(145deg, #ecfeff 0%, #fff 45%); border-color: #a5f3fc; }
  .card.type-siempre { --accent: #64748b; background: linear-gradient(145deg, #f1f5f9 0%, #fff 45%); border-color: #cbd5e1; }
  .card.type-hike { --accent: #16a34a; background: linear-gradient(145deg, #ecfdf5 0%, #fff 45%); border-color: #bbf7d0; }
  .card.pinned-card { box-shadow: 0 0 0 2px rgba(15,118,110,.18), var(--shadow); }
  /* Calm hover/focus for pointer users */
  @media (hover: hover) and (pointer: fine) {
    .card:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(18,32,30,.06), 0 12px 28px rgba(18,32,30,.12); }
  }
  .card:focus-within { box-shadow: 0 0 0 2px var(--teal-soft), var(--shadow); }
  /* Keep readable measure inside cards */
  .card .title, .card .why, .card .meta { max-width: 62ch; }
  .badge {
    display: inline-block; font-size: .68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; margin: 0 6px 6px 0;
  }
  .badge.urgent { background: var(--amber-soft); color: var(--amber); }
  .badge.booked { background: var(--teal-soft); color: var(--teal); }
  .badge.soon { background: #e0f2fe; color: #0369a1; }
  .badge.aldea { background: #ecfccb; color: #3f6212; }
  .badge.watch { background: #f1f5f9; color: #475569; }
  .badge.festejo { background: #fae8ff; color: #a21caf; }
  .badge.ticket { background: #ffedd5; color: #c2410c; }
  .badge.beach { background: #e0f2fe; color: #0369a1; }
  .badge.pinned { background: #ccfbf1; color: #0f766e; }
  /* Tipos adicionales para evergreen */
  .badge.park { background: #dcfce7; color: #166534; }
  .badge.hike { background: #fee2e2; color: #991b1b; }
  .badge.museo { background: #ede9fe; color: #5b21b6; }
  .badge.siempre { background: #e5e7eb; color: #374151; }
  .badge.other { background: #e5e7eb; color: #374151; }
  /* Subtle emoji markers on badges (visual only) */
  .badge.ticket::before { content: "🎟️ "; }
  .badge.booked::before { content: "✅ "; }
  .badge.festejo::before { content: "🎉 "; }
  .badge.beach::before { content: "🏖️ "; }
  .badge.watch::before { content: "👀 "; }
  .badge.aldea::before { content: "🏡 "; }
  .top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .pin-btn {
    flex: 0 0 auto; border: 1px solid var(--line); background: rgba(255,255,255,.75);
    border-radius: 999px; min-height: 36px; padding: 6px 10px; font-size: .78rem;
    font-weight: 700; color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pin-btn[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }
  .pin-btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--teal-soft); }
  .pin-btn::before { content: "📌"; opacity: .9; }
  .pin-btn[aria-pressed="true"]::before { content: "📍"; }
  .when { font-size: .82rem; color: var(--muted); margin: 0 0 4px; }
  .title { font-size: 1.05rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
  .why { font-size: .92rem; margin: 0 0 10px; }
  .meta { font-size: .8rem; color: var(--muted); margin: 0 0 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 42px; padding: 10px 14px; border-radius: 11px; font-size: .9rem;
    font-weight: 650; text-decoration: none; border: none; cursor: pointer; flex: 1 1 auto;
  }
  .btn.primary { background: var(--teal); color: #fff; }
  .btn.ghost { background: #fff; color: var(--teal); border: 1px solid #99f6e4; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: .95rem; }
  footer { font-size: .72rem; color: var(--muted); text-align: center; margin-top: 22px; padding: 0 8px; }
  #filter-empty { display: none; }
  #pinned-wrap[hidden], #settings[hidden] { display: none !important; }
  .hint { font-size: .8rem; color: var(--muted); margin: 0 0 10px; }
  /* (Removed timeline grouping UI; list is flat chronological cards) */

  /* Tighter, more compact header + chips on small phones */
  @media (max-width: 480px) {
    header { margin: -12px -14px 8px; padding: calc(8px + var(--safe-t)) 10px 6px; }
    h1 { font-size: 1.05rem; line-height: 1.2; }
    /* Collapse secondary line to keep header slim */
    .sub { display: none; }
    .chip { min-height: 32px; padding: 6px 10px; font-size: .82rem; }
    .icon-btn { min-height: 36px; padding: 6px 10px; font-size: .8rem; }
  }

  @media (min-width: 720px) {
    :root { --max: 920px; }
    .wrap { padding: 20px 24px 40px; }
    header { margin: -20px -24px 18px; padding: calc(18px + var(--safe-t)) 24px 12px; }
    h1 { font-size: 1.45rem; }
    .chips { flex-wrap: wrap; overflow: visible; }
    /* Desktop: show free-range dates inline; the toggle chip is not needed */
    #custom-inline { display: flex !important; }
    #date-toggle { display: none; }
    #list, #pinned { grid-template-columns: 1fr; gap: 14px; }
    .card { min-height: 100%; display: flex; flex-direction: column; }
    .actions { margin-top: auto; }
    .btn { flex: 0 1 auto; min-width: 140px; }
    .form-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1100px) {
    :root { --max: 1180px; }
    .wrap { padding: 28px 32px 48px; }
    header { margin: -28px -32px 22px; padding: calc(22px + var(--safe-t)) 32px 14px; }
    #list, #pinned { grid-template-columns: 1fr; gap: 16px; }
    .card { min-height: 100%; display: flex; flex-direction: column; }
    .actions { margin-top: auto; }
  }
  /* Reduced motion preference */
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none !important; }
  }
  /* Visually hidden for aria-live announcements */
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0);
    white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="header-inner">
        <div class="title-row">
          <div>
            <h1 id="app-title">Planes familia</h1>
            <p class="sub" id="app-sub">Configura tu familia</p>
          </div>
          <button type="button" class="icon-btn" id="settings-toggle">Perfil</button>
        </div>
        <div class="chips" role="toolbar" aria-label="Filtros">
          <button type="button" class="chip" data-preset="upcoming" aria-pressed="true">Importante</button>
          <button type="button" class="chip" data-preset="weekend" aria-pressed="false">Este finde</button>
          <button type="button" class="chip" data-preset="week" aria-pressed="false">7 días</button>
          <span id="month-chips" aria-label="Meses"></span>
          <button type="button" class="chip" id="date-toggle" aria-expanded="false" aria-controls="custom-inline" title="Rango libre">Fechas</button>
          <div id="custom-inline" title="Rango libre">
            <div class="di">
              <label for="from">Desde</label>
              <input type="date" id="from"/>
            </div>
            <div class="di">
              <label for="to">Hasta</label>
              <input type="date" id="to"/>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div id="live" class="sr-only" aria-live="polite"></div>

    <section id="settings" class="panel" hidden>
      <h2>Perfil de familia</h2>
      <p class="hint">Se guarda en este navegador. Sirve para reutilizar el visor con otra familia.</p>
      <div class="form-grid">
        <div>
          <label for="pf-title">Nombre del tablero</label>
          <input id="pf-title" type="text" placeholder="Planes familia"/>
        </div>
        <div>
          <label for="pf-base">Base / zona</label>
          <input id="pf-base" type="text" placeholder="Ciudad o zona"/>
        </div>
      </div>
      <div class="form-actions" style="margin-top:8px">
        <button type="button" class="btn ghost" id="use-geo">Usar mi ubicación</button>
      </div>
      <div class="form-grid" style="margin-top:10px">
        <div>
          <label for="pf-adults">Adultos (opcional)</label>
          <input id="pf-adults" type="text" placeholder="Nombres separados por coma"/>
        </div>
        <div>
          <label for="pf-radius">Radio (min)</label>
          <input id="pf-radius" type="number" min="15" max="180" step="5" placeholder="60"/>
        </div>
      </div>
      <label class="check-row" style="display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:.9rem;color:var(--ink)">
        <input id="pf-cal" type="checkbox" style="width:auto;margin-top:3px"/>
        <span>Al fijar, abrir Google Calendar con el plan (si estás logueado en Google, solo confirmas)</span>
      </label>
      <p class="section-label" style="margin-top:14px">Niños</p>
      <div id="kids-editor"></div>
      <div class="form-actions">
        <button type="button" class="btn ghost" id="add-kid">Añadir niño</button>
        <button type="button" class="btn primary" id="save-profile">Guardar perfil</button>
      </div>
    </section>
 
    <div class="section-label" id="list-label">Próximos</div>
    <div id="list"></div>
    <!-- Optional pin heatmap based on localStorage pins -->
    <div id="heatmap" aria-hidden="false">
      <div class="heatmap" id="pin-heatmap" role="list" aria-label="Densidad de fijados (próximos días)"></div>
    </div>
    <p id="filter-empty" class="empty">Nada en ese tramo. Prueba otro o vuelve a Importante.</p>
    <!-- Pinned moved below the main list so weekend/urgente is the first hit -->
    <div id="pinned-wrap" hidden>
      <div class="section-label">Fijados · lo que queréis hacer</div>
      <div id="pinned"></div>
    </div>
    <!-- Evergreen pool (inventory-owned). Renders when window.EVERGREEN exists -->
    <div id="evergreen-wrap">
      <div class="section-label">Siempre disponibles</div>
      <div id="evergreen"></div>
    </div>
    <footer id="updated"></footer>
  </div>
<script>
const _now = new Date();
const TODAY = new Date(_now.getFullYear(), _now.getMonth(), _now.getDate());
const PIN_KEY = "family-plans-pinned-v1";
const PROFILE_KEY = "family-plans-profile-v1";

const DEFAULT_PROFILE = {
  title: "Planes familia",
  base: "Gijón",
  adults: "",
  radiusMin: 60,
  calendarOnPin: false,
  kids: [
    { name: "", birthYear: null },
    { name: "", birthYear: null }
  ]
};

function ageFromYear(y) {
  if (!y) return null;
  const a = TODAY.getFullYear() - Number(y);
  return a >= 0 && a < 30 ? a : null;
}
function loadProfile() {
  try {
    const raw = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
    if (!raw) return structuredClone(DEFAULT_PROFILE);
    return {
      title: raw.title || DEFAULT_PROFILE.title,
      base: raw.base || "",
      adults: raw.adults || "",
      radiusMin: Number(raw.radiusMin) || 60,
      calendarOnPin: !!raw.calendarOnPin,
      kids: Array.isArray(raw.kids) && raw.kids.length ? raw.kids.map(k => ({
        name: k.name || "",
        birthYear: k.birthYear ? Number(k.birthYear) : null
      })) : structuredClone(DEFAULT_PROFILE.kids)
    };
  } catch {
    return structuredClone(DEFAULT_PROFILE);
  }
}
function saveProfile(p) {
  localStorage.setItem(PROFILE_KEY, JSON.stringify(p));
}
let profile = loadProfile();

function kidLabel(i) {
  const k = profile.kids[i];
  if (!k) return `niño ${i+1}`;
  const age = ageFromYear(k.birthYear);
  if (k.name && age != null) return `${k.name} (${age})`;
  if (k.name) return k.name;
  if (age != null) return `niño de ${age}`;
  return `niño ${i+1}`;
}
function kidsSummary() {
  const parts = profile.kids
    .map((k, i) => {
      const age = ageFromYear(k.birthYear);
      if (k.name && age != null) return `${k.name} (${age})`;
      if (k.name) return k.name;
      if (age != null) return `${age} años`;
      return null;
    })
    .filter(Boolean);
  return parts.length ? parts.join(" · ") : "Añade niños en Perfil";
}
function fillHeader() {
  document.getElementById("app-title").textContent = profile.title || "Planes familia";
  const base = profile.base ? profile.base : "Sin zona";
  document.getElementById("app-sub").textContent = `${base} · ${kidsSummary()}`;
  document.title = profile.title || "Planes familia";
}

/* Events use templates with {{kid0}}, {{kid1}}, {{base}} — no hardcoded family names */
/* Basic place lookup (approx coords) for distance filter */
function norm(s){ return (s||"").toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
const HOME_CITIES = {
  "gijon": { lat: 43.542, lng: -5.662 },
  "mieres": { lat: 43.251, lng: -5.777 },
  "villaviciosa": { lat: 43.481, lng: -5.435 },
  "colunga": { lat: 43.477, lng: -5.274 },
  "peon": { lat: 43.459, lng: -5.58 },
  "arroes": { lat: 43.477, lng: -5.596 }
};
const DISPLAY_HOME_NAMES = {
  gijon: "Gijón",
  mieres: "Mieres",
  villaviciosa: "Villaviciosa",
  colunga: "Colunga",
  peon: "Peón",
  arroes: "Arroes"
};
const PLACES = {
  "laboral": { lat: 43.532, lng: -5.628 },
  "gijon": HOME_CITIES["gijon"],
  "oviedo": { lat: 43.362, lng: -5.845 },
  "mieres": HOME_CITIES["mieres"],
  "villaviciosa": HOME_CITIES["villaviciosa"],
  "colunga": HOME_CITIES["colunga"],
  "el-coto": { lat: 43.536, lng: -5.654 },
  "moreda": { lat: 43.543, lng: -5.677 },
  "el-llano": { lat: 43.537, lng: -5.64 },
  "peon": HOME_CITIES["peon"],
  "arroes": HOME_CITIES["arroes"],

function parseYMD(s) {
  const [y,m,d] = s.split("-").map(Number);
  return new Date(y, m-1, d);
}
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function addDays(d, n) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate()+n);
  return x;
}
function upcomingWeekend(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (x.getDay()+6)%7;
  let sat = day <= 5 ? addDays(x, 5-day) : (day === 6 ? x : addDays(x, -1));
  if (day === 6) sat = x;
  return [sat, addDays(sat, 1)];
}
function overlaps(ev, from, to) {
  return parseYMD(ev.start) <= to && parseYMD(ev.end) >= from;
}
function formatDay(s) {
  return parseYMD(s).toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });
}
/* Distance helpers */
function haversineKm(a, b) {
  const R = 6371; // km
  const dLat = (b.lat - a.lat) * Math.PI/180;
  const dLng = (b.lng - a.lng) * Math.PI/180;
  const lat1 = a.lat * Math.PI/180;
  const lat2 = b.lat * Math.PI/180;
  const sinDLat = Math.sin(dLat/2);
  const sinDLng = Math.sin(dLng/2);
  const c = 2 * Math.asin(Math.sqrt(sinDLat*sinDLat + Math.cos(lat1)*Math.cos(lat2)*sinDLng*sinDLng));
  return R * c;
}

}

function gcalStamp(d, hm) {
  // hm "HH:MM" optional; all-day if missing
  if (!hm) {
    return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;

  const [H,M] = hm.split(":").map(Number);

}

}
function openGoogleCalendar(ev) {
  const start = parseYMD(ev.start);
  const end = parseYMD(ev.end);
  const t0 = parseFirstTime(ev.times);
  let dates;
  if (t0) {
    const [H,M] = t0.split(":").map(Number);
    const s = new Date(start.getFullYear(), start.getMonth(), start.getDate(), H, M||0);
    const e = new Date(s.getTime() + 90*60*1000);
    dates = gcalStamp(s, `${pad2(s.getHours())}:${pad2(s.getMinutes())}`) + "/" +
            gcalStamp(e, `${pad2(e.getHours())}:${pad2(e.getMinutes())}`);
  } else if (ev.start === ev.end) {
    const next = addDays(start, 1);
    dates = gcalStamp(start) + "/" + gcalStamp(next);
  } else {
    const next = addDays(end, 1);
    dates = gcalStamp(start) + "/" + gcalStamp(next);
  }
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: tpl(ev.title),
    dates,
    details: tpl(ev.why || ""),
    location: tpl(ev.place || profile.base || "")
  });
  window.open("https://calendar.google.com/calendar/render?" + params.toString(), "_blank", "noopener");
}

function loadPins() {
  try { return new Set(JSON.parse(localStorage.getItem(PIN_KEY) || "[]")); }
  catch { return new Set(); }
}
function savePins(set) { localStorage.setItem(PIN_KEY, JSON.stringify([...set])); }
let pins = loadPins();

function typeBadge(type) {
  const map = {
    ticket: ["ticket", "Entradas"],
    booked: ["booked", "Reservado"],
    festejo: ["festejo", "Festejo"],
    beach: ["beach", "Playa"],
    watch: ["watch", "Vigilando"],
    aldea: ["aldea", "Aldea"],
    park: ["park", "Parque"],
    hike: ["hike", "Senderismo"],
    museo: ["museo", "Museo"],
    siempre: ["siempre", "Siempre"],
    soon: ["soon", "Próximo"]
  };
  return map[type] || ["other", "Plan"];
}
function evergreenPinId(egId, dateStr) {
  return `evergreen:${egId}@${dateStr}`;
}
function parseEvergreenPinId(id) {
  const m = /^evergreen:(.+)@(\d{4}-\d{2}-\d{2})$/.exec(id);
  return m ? { id: m[1], date: m[2] } : null;
}
function isEvergreenPinnedForDate(egId, dateStr) {
  return pins.has(evergreenPinId(egId, dateStr));
}
function normalizeLinkLabel(label) {
  if (!label) return "Abrir";
  const s = String(label).trim();
  const verbs = ["Abrir", "Ver", "Comprar", "Inscribirse", "Inscribir", "Reservar"];
  const lower = s.toLowerCase();
  if (verbs.some(v => lower.startsWith(v.toLowerCase()))) return s;
  return "Ver " + s;
}
function cardHTML(ev) {
  const pinned = pins.has(ev.id);
  const [bClass, bLabel] = typeBadge(ev.type);
  const urgent = ev.tags.includes("urgent") ? `<span class="badge urgent">Urgente</span>` : "";
  const soonTag = ev.tags.includes("soon") ? `<span class="badge soon">Próximo</span>` : "";
  const booked = ev.tags.includes("booked") ? `<span class="badge booked">Reservado</span>` : "";
  const pinBadge = pinned ? `<span class="badge pinned">Fijado</span>` : "";
  const ariaLabel = pinned ? ("Quitar «" + tpl(ev.title) + "» de Fijados") : ("Fijar «" + tpl(ev.title) + "»");
  const titleAttr = pinned ? "Quitar de Fijados" : "Fijar";
  const when = ev.start === ev.end
    ? formatDay(ev.start) + (ev.times ? " · " + ev.times : "")
    : formatDay(ev.start) + " – " + formatDay(ev.end) + (ev.times ? " · " + ev.times : "");
  const actionText = normalizeLinkLabel(ev.linkLabel);
  return `<article class="card type-${ev.type}${pinned ? " pinned-card" : ""}" data-id="${ev.id}">
    <div class="top-row">
      <div class="badges">
        <span class="badge ${bClass}">${bLabel}</span>${booked}${soonTag}${urgent}${pinBadge}
      </div>
      <button type="button" class="pin-btn" data-pin="${ev.id}" aria-pressed="${pinned ? "true" : "false"}" aria-label="${ariaLabel}" title="${titleAttr}">${pinned ? "Fijado" : "Fijar"}</button>
    </div>
    <p class="when">${when}</p>
    <h3 class="title">${tpl(ev.title)}</h3>
    <p class="why">${tpl(ev.why)}</p>
    <p class="meta">${tpl(ev.place || "")}</p>
    <div class="actions">
      ${ev.link ? `<a class="btn primary" href="${ev.link}" target="_blank" rel="noopener">${actionText}</a>` : ""}
    </div>
  </article>`;
}

function setChip(preset) {
  document.querySelectorAll(".chip").forEach(c => {
    c.setAttribute("aria-pressed", c.dataset.preset === preset ? "true" : "false");
  });
}
function buildMonthChips() {
  if (!monthChips) return;
  const fmtShort = (d) => d.toLocaleDateString("es-ES", { month: "short" }).replace(/\.$/, "");
  const fmtLong = (d) => d.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
  const chips = [];
  for (let i = 0; i < 3; i++) {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth() + i, 1);
    const id = `m${i}`;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.dataset.preset = id;
    btn.dataset.month = String(d.getMonth());
    btn.dataset.year = String(d.getFullYear());
    btn.setAttribute("aria-pressed", "false");
    btn.setAttribute("aria-label", `Mes: ${fmtLong(d)}`);
    btn.textContent = fmtShort(d)[0].toUpperCase() + fmtShort(d).slice(1);
    chips.push(btn);
  }
  monthChips.replaceChildren(...chips);
  monthChips.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      mode = chip.dataset.preset;
      setChip(mode);
      render();
    });
  });
}
function renderHeatmap() {
  if (!heatmapEl) return;
  const weeks = 5; // ~5 semanas (~35 días)
  const totalDays = weeks * 7;
  const dowMon0 = (d) => (d.getDay() + 6) % 7; // 0=lun .. 6=dom
  const startOfWeek = (d) => addDays(d, -dowMon0(d));
  const start = startOfWeek(TODAY);
  const end = addDays(start, totalDays - 1);

  // Conjuntos de días «verdes» (fijados) y «amarillos» (inventario)
  const green = new Set(); // YYYY-MM-DD con fijados
  const yellow = new Set(); // YYYY-MM-DD con inventario (EVENTS o EG fechados)

  // Pinned events (por ID normal): marcan verde y también inventario
  const pinnedIds = [...pins].filter(id => !id.startsWith("evergreen:"));
  for (const id of pinnedIds) {
    const ev = EVENTS.find(e => e.id === id);
    if (!ev) continue;
    const s = parseYMD(ev.start);
    const e = parseYMD(ev.end);
    const a = s < start ? start : s;
    const b = e > end ? end : e;
    for (let d = a; d <= b; d = addDays(d, 1)) {
      const k = ymd(d);
      green.add(k);
      yellow.add(k);
    }
  }
  // Evergreen fijados (ID con fecha exacta)
  for (const pid of pins) {
    const eg = parseEvergreenPinId(pid);
    if (!eg) continue;
    const d = parseYMD(eg.date);
    if (d >= start && d <= end) {
      const k = ymd(d);
      green.add(k);
      yellow.add(k);
    }
  }
  // Inventario por eventos disponibles (EVENTS que solapan el día)
  for (let i = 0; i < totalDays; i++) {
    const d = addDays(start, i);
    for (const ev of EVENTS) {
      if (overlaps(ev, d, d)) {
        yellow.add(ymd(d));
      }
    }
  }
  // Render: 7 filas (lun→dom), columnas por semana
  const cells = [];
  for (let i = 0; i < totalDays; i++) {
    const d = addDays(start, i);
    const dateStr = ymd(d);
    const div = document.createElement("div");
    div.className = "hm-cell";
    // estado visual: verde > amarillo > vacío
    if (green.has(dateStr)) div.classList.add("pin");
    else if (yellow.has(dateStr)) div.classList.add("has");
    // posición por fila (día de semana)
    div.style.gridRowStart = String(dowMon0(d) + 1);
    div.setAttribute("data-date", dateStr);
    const titleState = green.has(dateStr) ? "fijado" : (yellow.has(dateStr) ? "inventario" : "sin planes");
    div.title = `${formatDay(dateStr)} · ${titleState}`;
    div.addEventListener("click", () => {
      fromEl.value = dateStr;
      toEl.value = dateStr;
      useCustomRange();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    cells.push(div);
  }
  heatmapEl.replaceChildren(...cells);
}
function renderEvergreen() {
  if (!evergreenEl) return;
  const data = Array.isArray(window.EVERGREEN) ? window.EVERGREEN : [];
  if (!data.length) {
    evergreenEl.innerHTML = "";
    return;
  }
  const html = data.map((it, idx) => {
    const t = it.title || `Elemento ${idx+1}`;
    const type = it.type || "soon";
    const [bClass, bLabel] = typeBadge(type);
    const link = it.link ? `<a class="btn ghost" href="${it.link}" target="_blank" rel="noopener">${normalizeLinkLabel(it.linkLabel || "Abrir")}</a>` : "";
    const egId = it.id || `ever-${idx}`;
    const [sat] = upcomingWeekend(TODAY);
    const defaultDate = ymd(sat);
    const pinnedNow = isEvergreenPinnedForDate(egId, defaultDate);
    const btnLabel = pinnedNow ? "Quitar" : "Fijar";
    return `<article class="card type-${type}">
      <div class="badges">
        <span class="badge ${bClass}">${bLabel}</span>
      </div>
      <h3 class="title">${t}</h3>
      <div class="eg-row">
        <button type="button" class="btn primary" data-evergreen="${egId}" data-default="${defaultDate}">${btnLabel}</button>
        ${link}
      </div>
    </article>`;
  }).join("");
  evergreenEl.innerHTML = html;
  // Click: pedir fecha y alternar pin en esa fecha
  evergreenEl.querySelectorAll("[data-evergreen]").forEach(btn => {
    btn.addEventListener("click", () => {
      const egId = btn.getAttribute("data-evergreen");
      const def = btn.getAttribute("data-default") || ymd(TODAY);
      const picked = window.prompt("Elige fecha (YYYY-MM-DD)", def);
      if (!picked) return; // cancelado
      if (!/^\\d{4}-\\d{2}-\\d{2}$/.test(picked)) { alert("Fecha inválida"); return; }
      const pid = evergreenPinId(egId, picked);
      if (pins.has(pid)) pins.delete(pid);
      else pins.add(pid);
      savePins(pins);
      // Actualiza etiqueta según estado del default
      const showPinned = isEvergreenPinnedForDate(egId, def);
      btn.textContent = showPinned ? "Quitar" : "Fijar";
      renderHeatmap();
      // Optionally update pinned section if visible (does not include evergreen pins)
      pinnedWrap.hidden = (document.getElementById("pinned").children.length === 0);
    });
  });
}
function filtered() {
  if (mode === "upcoming") {
    const horizon = addDays(TODAY, 21);
    return EVENTS.filter(ev => overlaps(ev, TODAY, horizon))
      .filter(ev => ev.priority >= 45 || ev.tags.includes("booked") || ev.tags.includes("urgent") || ev.tags.includes("ticket"))
      // Primary order: chronological by start date; ties by priority desc
      .sort((a,b) => a.start.localeCompare(b.start) || b.priority - a.priority);
  }
  if (mode === "weekend") {
    const [sat, sun] = upcomingWeekend(TODAY);
    return EVENTS
      .filter(ev => {
        const s = parseYMD(ev.start);
        return s >= sat && s <= sun; // start dentro del finde
      })
      .sort((a,b) => b.priority - a.priority || a.start.localeCompare(b.start));
  }
  if (mode === "week") {
    const to = addDays(TODAY, 6);
    return EVENTS
      .filter(ev => {
        const s = parseYMD(ev.start);
        return s >= TODAY && s <= to; // start dentro de la semana
      })
      .sort((a,b) => a.start.localeCompare(b.start) || b.priority - a.priority);
  }
  if (mode === "m0" || mode === "m1" || mode === "m2") {
    const offset = Number(mode.slice(1));
    const start = new Date(TODAY.getFullYear(), TODAY.getMonth() + offset, 1);
    const end = new Date(TODAY.getFullYear(), TODAY.getMonth() + offset + 1, 0);
    return EVENTS.filter(ev => overlaps(ev, start, end)).sort((a,b) => a.start.localeCompare(b.start) || b.priority - a.priority);
  }
  const f = fromEl.value ? parseYMD(fromEl.value) : TODAY;
  const t = toEl.value ? parseYMD(toEl.value) : addDays(TODAY, 30);
  return EVENTS.filter(ev => overlaps(ev, f, t)).sort((a,b) => a.start.localeCompare(b.start) || b.priority - a.priority);
}
function applyDistance(items) {
  const home = getHomeCoords();
  if (!home) return items; // if unknown base, don't filter by distance
  const limitKm = Math.max(1, Number(profile.radiusMin) || 60); // approx: 1 km ≈ 1 min (60 km/h)
  return items.filter(ev => {
    const ec = getEventCoords(ev, home);
    if (!ec) return true; // keep if unknown location
    const d = haversineKm(home, ec);
    return d <= limitKm;
  });
}
function bindPins(root) {
  root.querySelectorAll("[data-pin]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-pin");
      const ev = EVENTS.find(e => e.id === id);
      const wasPinned = pins.has(id);
      if (wasPinned) pins.delete(id);
      else {
        pins.add(id);
        if (profile.calendarOnPin && ev) {
          openGoogleCalendar(ev);
        }
      }
      savePins(pins);
      const live = document.getElementById("live");
      if (live && ev) {
        live.textContent = (wasPinned ? "Quitado de Fijados: " : "Añadido a Fijados: ") + tpl(ev.title);
      }
      render();
      // After pinning, nudge the Fijados section into view so the user sees it
      if (!wasPinned) {
        const wrap = document.getElementById("pinned-wrap");
        if (wrap) {
          wrap.hidden = false;
          try { wrap.scrollIntoView({ behavior: "smooth", block: "start" }); } catch {}
        }
      }
    });
  });
}
function renderKidsEditor() {
  kidsEditor.innerHTML = profile.kids.map((k, i) => `
    <div class="kid-row" data-kid-i="${i}">
      <div>
        <label>Nombre</label>
        <input type="text" data-k="name" value="${(k.name||"").replaceAll('"','&quot;')}" placeholder="Nombre"/>
      </div>
      <div>
        <label>Año nac.</label>
        <input type="number" data-k="birthYear" min="2005" max="${TODAY.getFullYear()}" value="${k.birthYear || ""}" placeholder="2022"/>
      </div>
      <button type="button" class="rm" data-rm="${i}" ${profile.kids.length<=1?"disabled":""}>Quitar</button>
    </div>`).join("");
  kidsEditor.querySelectorAll("[data-rm]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.getAttribute("data-rm"));
      if (profile.kids.length <= 1) return;
      profile.kids.splice(i, 1);
      renderKidsEditor();
    });
  });
}
function readProfileForm() {
  profile.title = document.getElementById("pf-title").value.trim() || "Planes familia";
  profile.base = document.getElementById("pf-base").value.trim();
  profile.adults = document.getElementById("pf-adults").value.trim();
  profile.radiusMin = Number(document.getElementById("pf-radius").value) || 60;
  profile.calendarOnPin = document.getElementById("pf-cal").checked;
  profile.kids = [...kidsEditor.querySelectorAll(".kid-row")].map(row => ({
    name: row.querySelector('[data-k="name"]').value.trim(),
    birthYear: row.querySelector('[data-k="birthYear"]').value ? Number(row.querySelector('[data-k="birthYear"]').value) : null
  }));
  if (!profile.kids.length) profile.kids = [{ name: "", birthYear: null }];
}
function fillProfileForm() {
  document.getElementById("pf-title").value = profile.title || "";
  document.getElementById("pf-base").value = profile.base || "";
  document.getElementById("pf-adults").value = profile.adults || "";
  document.getElementById("pf-radius").value = profile.radiusMin || 60;
  document.getElementById("pf-cal").checked = !!profile.calendarOnPin;
  renderKidsEditor();
}
function render() {
  fillHeader();
  const timeItems = filtered();
  const items = applyDistance(timeItems);
  // Resolve pinned items:
  // - Direct matches by event id
  // - Evergreen pins encoded as "<baseId>@YYYY-MM-DD" or "<baseId>@YYYY-MM-DD..YYYY-MM-DD"
  function parseEvergreenPin(key) {
    const m = String(key).match(/^(.+?)@(\d{4}-\d{2}-\d{2})(?:\.\.(\d{4}-\d{2}-\d{2}))?$/);
    return m ? { baseId: m[1], start: m[2], end: m[3] || m[2] } : null;
  }
  function resolvePinned() {
    const out = [];
    pins.forEach(key => {
      const direct = EVENTS.find(ev => ev.id === key);
      if (direct) {
        out.push(direct);
        return;
      }
      const eg = parseEvergreenPin(key);
      if (eg) {
        // Try to resolve from dated EVENTS first; otherwise from window.EVERGREEN (evergreen templates)
        const baseEvent = EVENTS.find(ev => ev.id === eg.baseId);
        if (baseEvent) {
          out.push({ ...baseEvent, id: String(key), start: eg.start, end: eg.end });
        } else {
          const EVER = (typeof window !== "undefined" && window.EVERGREEN) || null;
          let egBase = null;
          if (EVER) {
            if (Array.isArray(EVER)) egBase = EVER.find(e => e && e.id === eg.baseId) || null;
            else if (typeof EVER === "object") egBase = EVER[eg.baseId] || null;
          }
          if (egBase) {
            const built = {
              id: String(key),
              title: egBase.title || egBase.name || eg.baseId,
              why: egBase.why || egBase.desc || "",
              place: egBase.place || "",
              type: egBase.type || "watch",
              tags: Array.isArray(egBase.tags) ? egBase.tags.slice() : [],
              priority: typeof egBase.priority === "number" ? egBase.priority : 50,
              start: eg.start,
              end: eg.end,
              link: egBase.link || "",
              linkLabel: egBase.linkLabel || (egBase.link ? "Abrir" : "")
            };
            out.push(built);
          }
        }
      }
    });
    return out.sort((a,b) => b.priority - a.priority || a.start.localeCompare(b.start));
  }
  const pinnedItems = resolvePinned();
  pinnedWrap.hidden = pinnedItems.length === 0;
  pinnedEl.innerHTML = pinnedItems.map(cardHTML).join("");
  // Keep pinned items also visible in the main contextual list (do not filter them out)
  const rest = items;
  // Flat chronological list: sort by start date then priority (desc)
  rest.sort((a,b) => a.start.localeCompare(b.start) || b.priority - a.priority);
  list.innerHTML = rest.map(cardHTML).join("");
  empty.style.display = (rest.length || pinnedItems.length) ? "none" : "block";
  listLabel.style.display = rest.length ? "block" : "none";
  listLabel.textContent = mode === "upcoming" ? "Próximos importantes" : "En este tramo";
  bindPins(document);
  renderHeatmap();
  renderEvergreen();
}

document.getElementById("settings-toggle").addEventListener("click", () => {
  const open = settings.hasAttribute("hidden");
  settings.hidden = !open;
  if (open) fillProfileForm();
});

// Normalize evergreen items' types when present
// Ensures each EVERGREEN card has a real TYPE (not only "soon"/"Próximo")
function normalizeEvergreen() {
  const eg = (window && Array.isArray(window.EVERGREEN)) ? window.EVERGREEN : null;
  if (!eg) return;
  for (const item of eg) {
    if (!item || !item.id) continue;
    switch (item.id) {
      case "ever-isabel":
      case "ever-pericones":
        item.type = "park";
        break;
      case "ever-botanico":
      case "ever-acuario":
      case "ever-muja":
        item.type = "museo";
        break;
      case "ever-espinaredo":
        item.type = "hike";
        break;
      default:
        // No-op: aldea/beach/etc remain as-is
        // If a leftover sole type is "soon", keep tags but prefer keeping existing real type if known elsewhere
        if (item.type === "soon" && typeof item.tags !== "undefined") {
          // leave as-is; upstream content should provide a real type
        }
    }
  }
}

function useCustomRange() {
  mode = "custom";
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false"));

toEl.addEventListener("change", useCustomRange);

// Perfil: colapsado por defecto. No abrir automáticamente en primera visita.

fromEl.value = ymd(TODAY);
toEl.value = ymd(addDays(TODAY, 14));
document.getElementById("updated").textContent =
  "Perfil y fijados se guardan en este navegador · " + new Date().toLocaleDateString("es-ES");
normalizeEvergreen();

// Geolocation button: set base to nearest known city
const useGeoBtn = document.getElementById("use-geo");
if (useGeoBtn && "geolocation" in navigator) {
  useGeoBtn.addEventListener("click", () => {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        const here = { lat: latitude, lng: longitude };
        let bestKey = null;
        let bestD = Infinity;
        for (const [k, coords] of Object.entries(HOME_CITIES)) {
          const d = haversineKm(here, coords);
          if (d < bestD) { bestD = d; bestKey = k; }
        }
        if (bestKey) {
          profile.base = DISPLAY_HOME_NAMES[bestKey] || bestKey;
          const baseEl = document.getElementById("pf-base");
          if (baseEl) baseEl.value = profile.base;
          saveProfile(profile);
          render();
        }
      },
      () => {
        alert("No se pudo obtener la ubicación.");
      },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
    );
  });
} else if (useGeoBtn) {
  useGeoBtn.disabled = true;
  useGeoBtn.textContent = "Ubicación no disponible";
}
